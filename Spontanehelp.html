<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support - Spontane</title>
    <link rel="stylesheet" href="Spontanehelp.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <h1>Spontane</h1>
            <p>Help & Support Center</p>
        </div>
    </header>


    <section class="search-section">
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                placeholder="Search help topics..."
                id="searchInput"
            >
            <button class="search-btn">Search</button>
        </div>
    </section>

    
    <main class="main-content">
        <div class="container">
           
            <section class="support-options">
                <h2>Need Immediate Help?</h2>
                <div class="support-cards">
                    <div class="support-card live-chat">
                        <div class="card-icon">💬</div>
                        <h3>Live Chat</h3>
                        <p>Chat with our support team instantly</p>
                        <a href="#" class="support-link">Start Chat</a>
                    </div>
                    <div class="support-card email">
                        <div class="card-icon">✉️</div>
                        <h3>Email Support</h3>
                        <p>support@spontane.com</p>
                        <p class="response-time">Response within 24 hours</p>
                        <a href="#" class="support-link">Send Email</a>
                    </div>
                    <div class="support-card phone">
                        <div class="card-icon">📞</div>
                        <h3>Phone Support</h3>
                        <p>+9999999000</p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
